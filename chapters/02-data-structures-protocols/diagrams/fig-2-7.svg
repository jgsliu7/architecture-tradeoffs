<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">图 2-7　RecordBatch V2 的批头与记录体</text>

  <!-- 外框：一批由共享批头和多条记录组成 -->
  <rect x="40" y="55" width="800" height="350" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="440" y="83" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">RecordBatch V2：批头 + 多条记录</text>

  <!-- 批头：三组作用，不重列正文表 2-1 的全部字段 -->
  <rect x="60" y="102" width="760" height="197" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.3"/>
  <text x="440" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">批头：61 字节，整批共用</text>

  <rect x="78" y="143" width="226" height="113" rx="6" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.1"/>
  <text x="191" y="168" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">定位与时间</text>
  <text x="191" y="191" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#374151">baseOffset · baseTimestamp</text>
  <text x="191" y="217" text-anchor="middle" font-size="11" fill="#6B7280">提供记录差值的基准</text>

  <rect x="327" y="143" width="226" height="113" rx="6" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.1"/>
  <text x="440" y="168" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">格式与校验</text>
  <text x="440" y="191" text-anchor="middle" font-size="11" fill="#374151">magic 标识批格式</text>
  <text x="440" y="217" text-anchor="middle" font-size="11" fill="#6B7280">CRC 是批级校验值</text>

  <rect x="576" y="143" width="226" height="113" rx="6" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.1"/>
  <text x="689" y="168" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">幂等与事务</text>
  <text x="689" y="191" text-anchor="middle" font-size="11" fill="#374151">生产者身份、任期、序列</text>
  <text x="689" y="217" text-anchor="middle" font-size="11" fill="#6B7280">用于识别重试的记录批</text>

  <text x="440" y="281" text-anchor="middle" font-size="11.5" fill="#374151">maxTimestamp：CreateTime 为批内最大时间；LogAppendTime 为 Broker 追加时间</text>

  <!-- 记录体：仅呈现逐条变化的信息 -->
  <rect x="60" y="317" width="760" height="69" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.3"/>
  <text x="440" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">记录体：Record 1 … Record N</text>
  <text x="440" y="365" text-anchor="middle" font-size="11.5" fill="#374151">每条记录的 offset 与时间戳按批头基准保存差值，差值较小时可用变长整数减少开销</text>

</svg>
