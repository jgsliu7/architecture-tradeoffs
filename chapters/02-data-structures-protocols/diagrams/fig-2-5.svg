<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>


<text x="440" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">图 2-5　Redis 底层结构与编码升级路径</text>

<!-- SDS -->
  <rect x="40" y="60" width="240" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="160" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#4F46E5">SDS 简单动态字符串</text>
  <text x="160" y="110" text-anchor="middle" font-size="11" fill="#374151">String 类型底层 · 二进制安全</text>
  <text x="160" y="128" text-anchor="middle" font-size="11" fill="#6B7280">O(1) 取长 · 预分配 · 惰性释放</text>
  <text x="160" y="148" text-anchor="middle" font-size="11" fill="#6B7280">所有 key 都是 SDS</text>

  <!-- Dict -->
  <rect x="320" y="60" width="240" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="440" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#4F46E5">字典（dict）</text>
  <text x="440" y="110" text-anchor="middle" font-size="11" fill="#374151">Hash 类型底层 · 整个键空间</text>
  <text x="440" y="128" text-anchor="middle" font-size="11" fill="#6B7280">链式哈希 · SipHash（防哈希洪泛）</text>
  <text x="440" y="148" text-anchor="middle" font-size="11" fill="#6B7280">渐进式 rehash（摊还）</text>

  <!-- Skiplist -->
  <rect x="600" y="60" width="240" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="720" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#4F46E5">跳表（skiplist）</text>
  <text x="720" y="110" text-anchor="middle" font-size="11" fill="#374151">ZSET 底层（数据量大时）</text>
  <text x="720" y="128" text-anchor="middle" font-size="11" fill="#6B7280">多层有序链表 · O(log N)</text>
  <text x="720" y="148" text-anchor="middle" font-size="11" fill="#6B7280">比红黑树实现简单</text>

  <!-- Compact structures row -->
  <rect x="40" y="200" width="380" height="100" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="230" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">listpack（紧凑列表）</text>
  <text x="230" y="250" text-anchor="middle" font-size="11" fill="#374151">List/Hash/ZSET 小数据；7.2 起小型非整数 Set</text>
  <text x="230" y="268" text-anchor="middle" font-size="11" fill="#6B7280">连续内存 · 无指针开销 · 内存占用小</text>
  <text x="230" y="286" text-anchor="middle" font-size="11" fill="#6B7280">元素自记长度，避免 ziplist 的连锁更新</text>

  <rect x="460" y="200" width="380" height="100" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="650" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">intset（整数集合）</text>
  <text x="650" y="250" text-anchor="middle" font-size="11" fill="#374151">Set 小数据 + 全整数底层编码</text>
  <text x="650" y="268" text-anchor="middle" font-size="11" fill="#6B7280">有序整数数组 · 二分查找</text>
  <text x="650" y="286" text-anchor="middle" font-size="11" fill="#6B7280">超出适用范围后按类型与规模转换</text>

  <!-- Upgrade arrows -->
  <line x1="270" y1="300" x2="270" y2="340" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="610" y1="300" x2="610" y2="340" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Upgrade box -->
  <rect x="120" y="345" width="640" height="155" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="440" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">紧凑编码不再适用时自动升级，上层命令不变</text>
  <text x="440" y="392" text-anchor="middle" font-size="11.5" fill="#374151">Hash：listpack → 哈希表　 ZSET：listpack → 跳表 + 字典　 Set：两条路径 ↓</text>

  <!-- Set 双路径小图：三张编码胶囊，intset/listpack 琥珀（紧凑编码），hashtable 靛（查询结构），与上方卡片配色同义 -->
  <rect x="193" y="420" width="74" height="24" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <rect x="396" y="420" width="88" height="24" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <rect x="603" y="420" width="94" height="24" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="230" y="436" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, monospace" fill="#92400E">intset</text>
  <text x="440" y="436" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, monospace" fill="#92400E">listpack</text>
  <text x="650" y="436" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, monospace" fill="#4F46E5">hashtable</text>

  <!-- Set 路径一：非整数且仍较小，可进入 listpack；后续增长转哈希表 -->
  <line x1="271" y1="432" x2="392" y2="432" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="488" y1="432" x2="599" y2="432" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="331.5" y="424" text-anchor="middle" font-size="10.5" fill="#374151">混入非整数，规模仍小</text>
  <text x="543.5" y="424" text-anchor="middle" font-size="10.5" fill="#374151">继续增长</text>

  <!-- Set 路径二：纯整数规模过大，或非整数集合不再适合紧凑编码，可直达哈希表 -->
  <path d="M 230 448 Q 230 470 320 470 L 560 470 Q 650 470 650 457 L 650 447" fill="none" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="440" y="485" text-anchor="middle" font-size="10.5" fill="#374151">纯整数规模增大，或混入非整数后已不适合紧凑编码：直接转哈希表；升级后不自动降级</text>
</svg>
