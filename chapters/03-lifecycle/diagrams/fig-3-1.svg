<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 155 880 272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Title -->

  <!-- Three states along the top: 启动前 - 可服务 - 正常退出 -->
  <!-- Startup input -->
  <rect x="40" y="190" width="160" height="90" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="120" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">启动前的状态</text>
  <text x="120" y="244" text-anchor="middle" font-size="12" fill="#374151">已有持久化数据</text>
  <text x="120" y="262" text-anchor="middle" font-size="12" fill="#374151">或集群状态（若有）</text>

  <!-- Center running state -->
  <rect x="360" y="190" width="160" height="90" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">可服务状态</text>
  <text x="440" y="244" text-anchor="middle" font-size="12" fill="#374151">必要状态已恢复，</text>
  <text x="440" y="262" text-anchor="middle" font-size="12" fill="#374151">可对外承接请求</text>

  <!-- Normal exit: the required work depends on guarantees and deployment -->
  <rect x="680" y="190" width="160" height="90" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="760" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">正常退出</text>
  <text x="760" y="244" text-anchor="middle" font-size="12" fill="#374151">按方案完成必要收尾</text>
  <text x="760" y="262" text-anchor="middle" font-size="12" fill="#374151">有职责时交接或待接管</text>

  <!-- Start arrow: available state -> ready -->
  <path d="M210 215 L355 215" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="282" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">启动：恢复必要状态</text>
  <text x="282" y="205" text-anchor="middle" font-size="11" fill="#374151">完成恢复后才可服务</text>

  <!-- Shutdown arrow: ready -> normal exit -->
  <path d="M525 255 L675 255" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">关闭：必要收尾与职责处理</text>
  <text x="600" y="318" text-anchor="middle" font-size="12" fill="#374151">刷盘、交接或后移工作依配置和部署决定</text>

  <!-- Crash dashed arrow: normal shutdown work is skipped -->
  <path d="M440 290 C 440 400, 120 410, 120 285" fill="none" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
  <text x="260" y="410" text-anchor="middle" font-size="12" fill="#EF4444">崩溃 / kill -9：跳过正常收尾，下次启动可能需要恢复</text>
</svg>
