<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 68 880 444" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Four connection sources (left column) -->
  <!-- 内部应用客户端：下移到与 INTERNAL 监听器同高，连线水平 -->
  <rect x="30" y="157" width="150" height="56" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="105" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">内部应用客户端</text>
  <text x="105" y="198" text-anchor="middle" font-size="11" fill="#374151">受信内网 / VPC</text>

  <!-- 副本同步也接入 INTERNAL，而非仅由应用客户端使用。 -->
  <rect x="30" y="235" width="150" height="56" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="105" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">其他 Broker</text>
  <text x="105" y="276" text-anchor="middle" font-size="11" fill="#374151">副本同步</text>
  <rect x="30" y="327" width="150" height="56" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="105" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">外部应用客户端</text>
  <text x="105" y="368" text-anchor="middle" font-size="11" fill="#374151">公网 / 跨云</text>

  <!-- Controller 节点 -->
  <rect x="15" y="435" width="180" height="56" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="105" y="458" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">其他 Broker / Controller</text>
  <text x="105" y="476" text-anchor="middle" font-size="11" fill="#374151">KRaft 控制通信</text>

  <!-- Three listeners on the Broker (middle column) -->
  <!-- Broker container -->
  <rect x="290" y="80" width="580" height="420" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="580" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Broker / Controller 合并进程示例</text>
  <text x="580" y="121" text-anchor="middle" font-size="11" fill="#374151">listeners + listener.security.protocol.map</text>

  <!-- Listener 1: INTERNAL (SASL_SSL) -->
  <rect x="310" y="135" width="280" height="100" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="325" y="158" font-size="13" font-weight="700" fill="#111827">监听器 INTERNAL</text>
  <text x="325" y="178" font-size="12" fill="#374151">协议：SASL_SSL（认证 + 加密）</text>
  <text x="325" y="196" font-size="12" fill="#374151">端口 9092 · SASL=SCRAM-SHA-512</text>
  <text x="325" y="214" font-size="11" fill="#059669" font-weight="600">TLS：客户端校验服务端证书</text>
  <text x="325" y="228" font-size="11" fill="#374151">发布地址：内网域名</text>

  <text x="325" y="258" font-size="11" fill="#059669">本例：inter.broker.listener.name=INTERNAL</text>

  <!-- Listener 2: EXTERNAL (SASL_SSL) -->
  <rect x="310" y="305" width="280" height="100" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="325" y="328" font-size="13" font-weight="700" fill="#111827">监听器 EXTERNAL</text>
  <text x="325" y="348" font-size="12" fill="#374151">协议：SASL_SSL（认证 + 加密）</text>
  <text x="325" y="366" font-size="12" fill="#374151">端口 9093 · 公网 CA 签发证书</text>
  <text x="325" y="384" font-size="11" fill="#D97706" font-weight="600">TLS：客户端校验服务端证书</text>
  <text x="325" y="398" font-size="11" fill="#374151">发布地址：公网域名</text>

  <!-- Listener 3: CONTROLLER (KRaft) -->
  <rect x="310" y="435" width="280" height="55" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/>
  <text x="325" y="456" font-size="13" font-weight="700" fill="#111827">监听器 CONTROLLER</text>
  <text x="325" y="474" font-size="12" fill="#374151">协议：SSL · 端口 9094</text>
  <text x="325" y="487" font-size="11" fill="#374151">本例：双向证书认证（显式配置）</text>

  <!-- 来源到监听器：副本同步与内部应用共用 INTERNAL。 -->
  <line x1="180" y1="185" x2="308" y2="185" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M180 263 H260 V225 H308" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="180" y1="355" x2="308" y2="355" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="195" y1="463" x2="308" y2="463" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right column: inside broker security layers -->
  <!-- After listener: shared authz + audit core -->
  <rect x="650" y="135" width="200" height="355" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="750" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">Broker 请求处理（示意）</text>
  <line x1="670" y1="172" x2="830" y2="172" stroke="#059669" stroke-width="1"/>

  <!-- Authorizer -->
  <rect x="662" y="180" width="176" height="74" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.3"/>
  <text x="750" y="201" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">授权 Authorizer</text>
  <text x="750" y="218" text-anchor="middle" font-size="11" fill="#374151">启用后检查 ACL</text>
  <text x="750" y="234" text-anchor="middle" font-size="10" fill="#374151">主体 · 操作 · 资源模式</text>
  <text x="750" y="248" text-anchor="middle" font-size="10" fill="#374151">来源与允许 / 拒绝</text>

  <!-- ACL store -->
  <rect x="670" y="258" width="160" height="58" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.3"/>
  <text x="750" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">ACL 存储</text>
  <text x="750" y="298" text-anchor="middle" font-size="11" fill="#374151">KRaft 元数据日志</text>
  <text x="750" y="312" text-anchor="middle" font-size="11" fill="#374151">前缀授权（app-a.）</text>

  <!-- Authorizer 日志的可见范围取决于日志级别。 -->
  <rect x="670" y="330" width="160" height="48" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.3"/>
  <text x="750" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">授权日志</text>
  <text x="750" y="370" text-anchor="middle" font-size="11" fill="#374151">访问决策线索</text>

  <!-- topic store -->
  <rect x="670" y="392" width="160" height="68" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.3"/>
  <text x="750" y="414" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">主题分区</text>
  <text x="750" y="432" text-anchor="middle" font-size="11" fill="#374151">日志段读写</text>
  <text x="750" y="448" text-anchor="middle" font-size="11" fill="#374151">副本同步（也走 TLS）</text>

  <!-- 客户端监听器都进入 Authorizer；控制面不指向主题分区读写 -->
  <line x1="590" y1="185" x2="660" y2="207" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <path d="M590 355 H626 V233 H660" fill="none" stroke="#D97706" stroke-width="1.6" marker-end="url(#arrow-orange)"/>
</svg>
