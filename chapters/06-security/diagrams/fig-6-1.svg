<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 96 880 372" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>

  <!-- 连接建立：传输保护和身份认证属于建连阶段。 -->
  <text x="35" y="119" font-size="13" font-weight="700" fill="#111827">建连阶段</text>
  <rect x="35" y="147" width="115" height="62" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="92.5" y="173" text-anchor="middle" font-size="14" fill="#111827">客户端</text>
  <text x="92.5" y="193" text-anchor="middle" font-size="11" fill="#374151">建立连接</text>
  <line x1="150" y1="178" x2="174" y2="178" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="135" width="310" height="86" rx="8" fill="#FFF7F7" stroke="#EF4444" stroke-width="1.4" stroke-dasharray="5 3"/>
  <rect x="190" y="147" width="130" height="62" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.2"/>
  <text x="255" y="173" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">传输保护</text>
  <text x="255" y="193" text-anchor="middle" font-size="11" fill="#374151">TLS（若启用）</text>
  <rect x="340" y="147" width="140" height="62" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.2"/>
  <text x="410" y="173" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">身份认证</text>
  <text x="410" y="193" text-anchor="middle" font-size="11" fill="#374151">确认连接身份</text>
  <line x1="490" y1="178" x2="520" y2="178" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="525" y="147" width="180" height="62" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="615" y="173" text-anchor="middle" font-size="14" fill="#111827">连接建立</text>
  <text x="615" y="193" text-anchor="middle" font-size="11" fill="#374151">后续请求复用连接</text>
  <text x="35" y="257" font-size="13" font-weight="700" fill="#111827">每次操作</text>
  <rect x="35" y="277" width="120" height="62" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="95" y="303" text-anchor="middle" font-size="14" fill="#111827">发起请求</text>
  <text x="95" y="323" text-anchor="middle" font-size="11" fill="#374151">命令或 SQL</text>
  <line x1="155" y1="308" x2="203" y2="308" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="205" y="277" width="140" height="62" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="275" y="303" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">授权检查</text>
  <text x="275" y="323" text-anchor="middle" font-size="11" fill="#374151">是否允许本次操作</text>
  <line x1="345" y1="308" x2="393" y2="308" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="395" y="277" width="130" height="62" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="460" y="303" text-anchor="middle" font-size="14" fill="#111827">执行</text>
  <text x="460" y="323" text-anchor="middle" font-size="11" fill="#374151">处理请求</text>
  <line x1="525" y1="308" x2="573" y2="308" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="575" y="277" width="130" height="62" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="640" y="303" text-anchor="middle" font-size="14" fill="#111827">数据读写</text>
  <text x="640" y="323" text-anchor="middle" font-size="11" fill="#374151">内存或磁盘</text>
  <text x="565" y="371" font-size="11" fill="#374151">静态保护（单独配置）</text>
  <rect x="565" y="385" width="150" height="56" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="640" y="409" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">存储加密（若启用）</text>
  <text x="640" y="428" text-anchor="middle" font-size="11" fill="#374151">保护落盘数据</text>
  <rect x="745" y="135" width="115" height="306" rx="8" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="802.5" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">审计</text>
  <text x="802.5" y="185" text-anchor="middle" font-size="11" fill="#92400E">按配置记录</text>
  <line x1="760" y1="199" x2="845" y2="199" stroke="#D97706" stroke-width="1"/>
  <text x="802.5" y="226" text-anchor="middle" font-size="11" fill="#92400E">认证失败</text>
  <text x="802.5" y="249" text-anchor="middle" font-size="11" fill="#92400E">授权拒绝</text>
  <text x="802.5" y="272" text-anchor="middle" font-size="11" fill="#92400E">选定操作</text>
  <line x1="760" y1="288" x2="845" y2="288" stroke="#D97706" stroke-width="1"/>
  <text x="802.5" y="316" text-anchor="middle" font-size="11" fill="#92400E">供事后追查</text>
</svg>
