<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 74 820 236" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>

  <!-- 中心节点：一处状态变化 -->
  <rect x="330" y="86" width="160" height="56" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="410" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">一处状态变化</text>
  <text x="410" y="129" text-anchor="middle" font-size="12" fill="#374151">主节点上的写入</text>

  <!-- 分叉线到四个子问题 -->
  <line x1="410" y1="142" x2="410" y2="172" stroke="#4B5563" stroke-width="1.5"/>
  <line x1="160" y1="172" x2="660" y2="172" stroke="#4B5563" stroke-width="1.5"/>
  <line x1="160" y1="172" x2="160" y2="204" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="327" y1="172" x2="327" y2="204" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="493" y1="172" x2="493" y2="204" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="172" x2="660" y2="204" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 子问题1：传播什么 -->
  <rect x="85" y="206" width="150" height="92" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="160" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">① 传播什么</text>
  <text x="160" y="252" text-anchor="middle" font-size="12" fill="#374151">传播单元的粒度</text>
  <text x="160" y="271" text-anchor="middle" font-size="11" fill="#374151">命令 / 事件 / 消息</text>
  <text x="160" y="289" text-anchor="middle" font-size="11" fill="#6B7280">Redis · MySQL · Kafka</text>

  <!-- 子问题2：怎么传播 -->
  <rect x="252" y="206" width="150" height="92" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="327" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">② 怎么传播</text>
  <text x="327" y="252" text-anchor="middle" font-size="12" fill="#374151">推流 还是 拉取</text>
  <text x="327" y="271" text-anchor="middle" font-size="11" fill="#374151">主端推流 / 副本轮询拉取</text>
  <text x="327" y="289" text-anchor="middle" font-size="9.5" fill="#6B7280">Redis·MySQL 推流 · Kafka 拉取</text>

  <!-- 子问题3：传播到什么程度（框 418/150 装不下三档词，加宽到 411/164，中心仍 493，与②④各留 9/10px 缝） -->
  <rect x="411" y="206" width="164" height="92" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="493" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">③ 到什么程度</text>
  <text x="493" y="252" text-anchor="middle" font-size="12" fill="#374151">确认与可见性要求</text>
  <text x="493" y="271" text-anchor="middle" font-size="11" fill="#374151">接收 / 落盘 / 应用</text>
  <text x="493" y="289" text-anchor="middle" font-size="11" fill="#6B7280">等待条件影响写入延迟</text>

  <!-- 子问题4：断了怎么办 -->
  <rect x="585" y="206" width="150" height="92" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="660" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">④ 断了怎么办</text>
  <text x="660" y="252" text-anchor="middle" font-size="12" fill="#374151">断点续传 + 故障恢复</text>
  <text x="660" y="271" text-anchor="middle" font-size="11" fill="#374151">位点对齐 · 增量补差</text>
  <text x="660" y="289" text-anchor="middle" font-size="11" fill="#6B7280">重新全量同步</text>

</svg>
