<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 68 940 608" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 主节点提交路径：三行分别表示三种模式，不共用先后箭头。 -->
  <rect x="30" y="80" width="880" height="252" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="470" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">主节点 Source：客户端提交路径</text>

  <!-- 异步：写 binlog、引擎提交、返回客户端。 -->
  <text x="105" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">异步</text>
  <rect x="180" y="126" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="255" y="153" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">写 binlog</text>
  <line x1="330" y1="148" x2="363" y2="148" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="365" y="126" width="148" height="44" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="439" y="153" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">引擎提交（commit）</text>
  <line x1="513" y1="148" x2="543" y2="148" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="545" y="126" width="148" height="44" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="619" y="153" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">返回客户端</text>

  <!-- 默认 AFTER_SYNC：先刷 binlog，等副本 ACK，再引擎提交。 -->
  <text x="105" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">半同步</text>
  <text x="105" y="231" text-anchor="middle" font-size="10.5" fill="#374151">AFTER_SYNC（8.0 默认）</text>
  <rect x="180" y="196" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="255" y="223" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">binlog 刷盘</text>
  <line x1="330" y1="218" x2="363" y2="218" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="365" y="196" width="148" height="44" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="439" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#EF4444">等副本 ACK</text>
  <text x="439" y="232" text-anchor="middle" font-size="11" fill="#374151">超时则降级为异步</text>
  <line x1="513" y1="218" x2="543" y2="218" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="545" y="196" width="148" height="44" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="619" y="223" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">引擎提交（commit）</text>
  <line x1="693" y1="218" x2="723" y2="218" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="725" y="196" width="148" height="44" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="799" y="223" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">返回客户端</text>

  <!-- AFTER_COMMIT 独立成行：引擎提交后等 ACK。 -->
  <text x="105" y="283" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">半同步</text>
  <text x="105" y="301" text-anchor="middle" font-size="10.5" fill="#374151">AFTER_COMMIT</text>
  <rect x="180" y="266" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="255" y="293" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">写 binlog</text>
  <line x1="330" y1="288" x2="363" y2="288" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="365" y="266" width="148" height="44" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="439" y="293" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">引擎提交（commit）</text>
  <line x1="513" y1="288" x2="543" y2="288" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="545" y="266" width="148" height="44" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="619" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#EF4444">等副本 ACK</text>
  <text x="619" y="302" text-anchor="middle" font-size="11" fill="#374151">超时则降级为异步</text>
  <line x1="693" y1="288" x2="723" y2="288" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="725" y="266" width="148" height="44" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="799" y="293" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">返回客户端</text>

  <!-- 复制数据流独立绘制；发送 binlog 不以主节点收到 ACK 为前提。 -->
  <rect x="30" y="440" width="390" height="100" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="225" y="463" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">主节点：复制数据发送</text>
  <rect x="435" y="350" width="475" height="310" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="780" y="373" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">从节点 Replica：接收与回放</text>

  <rect x="50" y="480" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="130" y="498" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">binlog（行级事件）</text>
  <text x="130" y="516" text-anchor="middle" font-size="11" fill="#374151">ROW 格式，按事务追加</text>
  <line x1="210" y1="502" x2="243" y2="502" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="245" y="480" width="155" height="44" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="322" y="498" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Binlog Dump 线程</text>
  <text x="322" y="516" text-anchor="middle" font-size="11" fill="#374151">持续发送 binlog 事件</text>
  <line x1="400" y1="502" x2="453" y2="502" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="455" y="480" width="170" height="44" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="540" y="498" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">I/O 线程（收流）</text>
  <text x="540" y="516" text-anchor="middle" font-size="11" fill="#374151">主动连接主，订阅 binlog 流</text>
  <line x1="625" y1="502" x2="668" y2="502" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="670" y="480" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="780" y="498" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">relay log（中继日志）</text>
  <text x="780" y="516" text-anchor="middle" font-size="11" fill="#374151">写到本地的 binlog 副本</text>

  <!-- relay log 分出 ACK 与本地回放两条支路。ACK 不等待 SQL 回放。 -->
  <line x1="780" y1="480" x2="780" y2="438" stroke="#EF4444" stroke-width="1.2" marker-end="url(#arrowRed)"/>
  <rect x="670" y="388" width="220" height="48" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="780" y="407" text-anchor="middle" font-size="11.5" font-weight="600" fill="#EF4444">回 ACK 给主（已写 relay log 文件）</text>
  <text x="780" y="426" text-anchor="middle" font-size="11" fill="#374151">不等本地回放完成</text>
  <!-- 回 ACK 分别指向两档等待框；竖线走列间空隙。 -->
  <path d="M 670 412 L 531 412 L 531 298 M 531 278 L 531 252 L 439 252 L 439 242" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowRed)"/>
  <path d="M 619 412 L 619 312" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowRed)"/>
  <text x="320" y="380" text-anchor="middle" font-size="12" font-weight="600" fill="#EF4444">ACK 回路仅在半同步模式启用</text>

  <line x1="780" y1="524" x2="780" y2="553" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="670" y="555" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="780" y="573" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">SQL 线程（图示单线程）</text>
  <text x="780" y="591" text-anchor="middle" font-size="11" fill="#374151">读 relay log → 本地重放事务</text>
  <line x1="780" y1="599" x2="780" y2="618" stroke="#059669" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <rect x="670" y="620" width="220" height="26" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="780" y="638" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">本地数据追平</text>

  <!-- GTID 辅助定位仍单独说明，不把它画成 ACK 或回放的先决条件。 -->
  <rect x="50" y="565" width="350" height="80" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.2"/>
  <text x="225" y="588" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">GTID：用事务标识定位复制进度</text>
  <text x="225" y="610" text-anchor="middle" font-size="11" fill="#374151">提交事务时分配 GTID（source_id:seq）</text>
  <text x="225" y="631" text-anchor="middle" font-size="11" fill="#374151">主节点按副本的 GTID 集合补发所缺事务</text>

</svg>
