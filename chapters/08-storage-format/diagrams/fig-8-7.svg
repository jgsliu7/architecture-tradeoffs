<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 48 880 248" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title -->

  <!-- Phase labels -->
  <text x="160" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">① 本地热段</text>
  <text x="440" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">② 段关闭且稳定 → 上传</text>
  <text x="720" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">③ 远程已存，本地按策略保留</text>

  <!-- ===== Phase 1: Local hot segments ===== -->
  <rect x="40" y="90" width="240" height="100" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="160" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">Kafka Broker 本地磁盘</text>
  <rect x="60" y="125" width="60" height="30" rx="4" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="90" y="145" text-anchor="middle" font-size="11" fill="#374151">.log</text>
  <rect x="125" y="125" width="60" height="30" rx="4" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="155" y="145" text-anchor="middle" font-size="11" fill="#374151">.index</text>
  <rect x="190" y="125" width="60" height="30" rx="4" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="220" y="145" text-anchor="middle" font-size="11" fill="#374151">.timeindex</text>
  <text x="160" y="178" text-anchor="middle" font-size="11" fill="#6B7280">活跃段：正在追加写入</text>

  <!-- Arrow 1->2 -->
  <line x1="280" y1="140" x2="338" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="130" text-anchor="middle" font-size="10" fill="#6B7280">关闭</text>

  <!-- ===== Phase 2: Upload ===== -->
  <rect x="340" y="90" width="200" height="100" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="440" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">RemoteStorageManager</text>
  <text x="440" y="140" text-anchor="middle" font-size="12" fill="#374151">异步上传到远程存储</text>
  <text x="440" y="160" text-anchor="middle" font-size="11" fill="#6B7280">上传日志、索引及辅助状态</text>
  <text x="440" y="180" text-anchor="middle" font-size="11" fill="#6B7280">上传完成后才可清理本地</text>

  <!-- Arrow 2->3 -->
  <line x1="540" y1="140" x2="598" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Phase 3: Remote storage ===== -->
  <rect x="600" y="90" width="250" height="100" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="725" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">远程存储</text>
  <rect x="620" y="125" width="60" height="30" rx="4" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="650" y="145" text-anchor="middle" font-size="11" fill="#374151">.log</text>
  <rect x="685" y="125" width="60" height="30" rx="4" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="715" y="145" text-anchor="middle" font-size="11" fill="#374151">.index</text>
  <rect x="750" y="125" width="60" height="30" rx="4" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="780" y="145" text-anchor="middle" font-size="11" fill="#374151">.timeindex</text>
  <text x="725" y="178" text-anchor="middle" font-size="11" fill="#6B7280">冷段：低频访问</text>

  <!-- ===== Read path (bottom) ===== -->
  <rect x="40" y="250" width="810" height="32" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="445" y="271" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">读取路径：本地段可用则从本地读；本地段已移除则从远端读</text>

  <!-- Arrow from read path to local -->
  <line x1="120" y1="250" x2="120" y2="195" stroke="#059669" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="108" y="225" text-anchor="end" font-size="10" fill="#059669">本地段可用</text>

  <!-- Arrow from read path to remote -->
  <line x1="700" y1="250" x2="700" y2="195" stroke="#059669" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="688" y="225" text-anchor="end" font-size="10" fill="#059669">本地段已移除，读远端</text>
</svg>
