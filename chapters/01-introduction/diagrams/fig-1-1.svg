<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 52 880 424" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- 标题 -->

  <!-- ============ 第 1 行：三类核心能力 ============ -->
  <text x="40" y="74" font-size="13" font-weight="600" fill="#374151">电商订单系统中的三类需求</text>

  <!-- 能力 1：快速读写 -->
  <rect x="40" y="86" width="240" height="70" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="160" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">快速读写</text>
  <text x="160" y="132" text-anchor="middle" font-size="12.5" fill="#374151">缓存 · 计数 · 会话 · 锁</text>

  <!-- 能力 2：可靠存储 -->
  <rect x="320" y="86" width="240" height="70" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="440" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">可靠存储</text>
  <text x="440" y="132" text-anchor="middle" font-size="12.5" fill="#374151">事务 · 查询 · 持久化</text>

  <!-- 能力 3：异步解耦与流转 -->
  <rect x="600" y="86" width="240" height="70" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="720" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">异步解耦与流转</text>
  <text x="720" y="132" text-anchor="middle" font-size="12.5" fill="#374151">消息 · 流 · 事件</text>

  <!-- 代表箭头（能力 → 软件） -->
  <text x="40" y="186" font-size="13" font-weight="600" fill="#374151">示例中的软件分工</text>
  <line x1="160" y1="156" x2="160" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="156" x2="440" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="156" x2="720" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ 第 2 行：代表软件 ============ -->
  <!-- Redis -->
  <rect x="40" y="204" width="240" height="92" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.8"/>
  <text x="160" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Redis</text>
  <text x="160" y="252" text-anchor="middle" font-size="12.5" fill="#374151">内存数据结构服务器</text>
  <text x="160" y="272" text-anchor="middle" font-size="12" fill="#4F46E5">按键操作内存数据</text>
  <text x="160" y="288" text-anchor="middle" font-size="12" fill="#6B7280">容量受内存约束，复杂聚合受限</text>

  <!-- MySQL -->
  <rect x="320" y="204" width="240" height="92" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="440" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">MySQL</text>
  <text x="440" y="252" text-anchor="middle" font-size="12.5" fill="#374151">关系库（表/行 + SQL + 引擎）</text>
  <text x="440" y="272" text-anchor="middle" font-size="12" fill="#D97706">查询与事务处理</text>
  <text x="440" y="288" text-anchor="middle" font-size="12" fill="#6B7280">代价：提交延迟、调优门槛</text>

  <!-- Kafka -->
  <rect x="600" y="204" width="240" height="92" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="720" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Kafka</text>
  <text x="720" y="252" text-anchor="middle" font-size="12.5" fill="#374151">追加写日志的分布式流平台</text>
  <text x="720" y="272" text-anchor="middle" font-size="12" fill="#059669">按分区追加与批量读取</text>
  <text x="720" y="288" text-anchor="middle" font-size="12" fill="#6B7280">批量等待增加延迟，随机查询受限</text>

  <!-- ============ 第 3 行：电商订单系统（三者协同） ============ -->
  <rect x="40" y="346" width="800" height="118" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="440" y="368" text-anchor="middle" font-size="13.5" font-weight="600" fill="#374151">示例：电商下单链路</text>

  <!-- 用户下单 -->
  <rect x="63" y="386" width="138" height="56" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="132" y="411" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">用户下单</text>
  <text x="132" y="430" text-anchor="middle" font-size="11.5" fill="#374151">读购物车 / 校验</text>

  <!-- Redis 购物车 -->
  <rect x="217" y="386" width="138" height="56" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="286" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#4F46E5">Redis</text>
  <text x="286" y="430" text-anchor="middle" font-size="11.5" fill="#374151">购物车 / 库存计数缓存</text>

  <!-- MySQL 订单 -->
  <rect x="371" y="386" width="138" height="56" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="440" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#D97706">MySQL</text>
  <text x="440" y="430" text-anchor="middle" font-size="11.5" fill="#374151">订单 / 账户落库（事务）</text>

  <!-- Kafka 事件 -->
  <rect x="525" y="386" width="138" height="56" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="594" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">Kafka</text>
  <text x="594" y="430" text-anchor="middle" font-size="11.5" fill="#374151">发布“订单已创建”事件</text>

  <!-- 下游 -->
  <rect x="679" y="386" width="138" height="56" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="748" y="408" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">下游消费者</text>
  <text x="748" y="430" text-anchor="middle" font-size="11.5" fill="#374151">履约 / 推荐 / 风控</text>

  <!-- 数据流箭头 -->
  <line x1="201" y1="414" x2="215" y2="414" stroke="#EF4444" stroke-width="1.8" marker-end="url(#arrow-flow)"/>
  <line x1="355" y1="414" x2="369" y2="414" stroke="#EF4444" stroke-width="1.8" marker-end="url(#arrow-flow)"/>
  <line x1="509" y1="414" x2="523" y2="414" stroke="#EF4444" stroke-width="1.8" marker-end="url(#arrow-flow)"/>
  <line x1="663" y1="414" x2="677" y2="414" stroke="#EF4444" stroke-width="1.8" marker-end="url(#arrow-flow)"/>

  <!-- 数据流标注 -->
  <text x="208" y="402" text-anchor="middle" font-size="10.5" fill="#EF4444">读</text>
  <text x="362" y="402" text-anchor="middle" font-size="10.5" fill="#EF4444">写</text>
  <text x="516" y="402" text-anchor="middle" font-size="10.5" fill="#EF4444">发</text>
  <text x="670" y="402" text-anchor="middle" font-size="10.5" fill="#EF4444">消</text>
</svg>
